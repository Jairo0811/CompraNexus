{% extends "base.html" %}
{% block content %}
<section class="panel narrow">
 <div class="panel-head"><div><h2>{{ "Actualizar registro" if record else "Agregar registro" }}</h2><p>Los campos marcados con * son obligatorios.</p></div></div>
 <form method="post" action="/catalogs/{{ kind }}/save" class="formgrid">
 <input type="hidden" name="_csrf" value="{{ csrf }}">
 <input type="hidden" name="id" value="{{ record.id if record else '' }}">
 {% for name, label, type, required in fields %}
 <label class="field"><span>{{ label }}{% if required %} *{% endif %}</span>
 {% if type in ['status', 'unit', 'department'] %}
 <select name="{{ name }}" required>
   {% if type != 'status' %}<option value="">Seleccione...</option>{% endif %}
   {% for value, option_label in options[type] %}
   <option value="{{ value }}" {% if (record and record|attr(name)|string == value|string) or (not record and type == 'status' and value == 'Activo') %}selected{% endif %}>{{ option_label }}</option>
   {% endfor %}
 </select>
 {% else %}
 <input type="{{ 'number' if type == 'number' else 'text' }}" name="{{ name }}"
   value="{{ record|attr(name) if record else ('0' if type == 'number' else '') }}"
   {% if required %}required{% endif %} {% if type == 'number' %}min="0" step="1"{% endif %} maxlength="180">
 {% endif %}
 </label>
 {% endfor %}
 <div class="form-actions"><a class="btn ghost" href="/catalogs/{{ kind }}">Cancelar</a><button class="btn" type="submit">Guardar registro</button></div>
 </form>
</section>
{% endblock %}

name: compranexus

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Ejecute .\\scripts\\Start-CompraNexus.ps1 o defina MSSQL_SA_PASSWORD en .env}"
    ports:
      - "127.0.0.1:14330:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    restart: unless-stopped
    healthcheck:
      # Comprueba el puerto interno; la API comprueba ademas la autenticacion
      # y la disponibilidad de la BD mediante su endpoint /health.
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/1433'"]
      interval: 5s
      timeout: 3s
      start_period: 40s
      retries: 30

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__SqlServer: "Server=sqlserver,1433;Database=CompraNexus;User Id=sa;Password=${MSSQL_SA_PASSWORD:?Defina MSSQL_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True"
      Accounting__ServiceUrl: "${ACCOUNTING_SERVICE_URL:-}"
      Accounting__BearerToken: "${ACCOUNTING_BEARER_TOKEN:-}"
    depends_on:
      sqlserver:
        condition: service_healthy
    ports:
      - "127.0.0.1:5098:8080"
    restart: on-failure

  frontend:
    build:
      context: ./frontend
    depends_on:
      - api
    ports:
      - "127.0.0.1:8088:80"
    restart: unless-stopped

volumes:
  sqlserver_data:

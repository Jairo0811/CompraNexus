name: compranexus
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Defina MSSQL_SA_PASSWORD en .env}"
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__SqlServer: "Server=sqlserver,1433;Database=CompraNexus;User Id=sa;Password=${MSSQL_SA_PASSWORD:?Defina MSSQL_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True"
      Accounting__ServiceUrl: "${ACCOUNTING_SERVICE_URL:-}"
      Accounting__BearerToken: "${ACCOUNTING_BEARER_TOKEN:-}"
    depends_on:
      - sqlserver
    ports:
      - "127.0.0.1:5098:8080"
  frontend:
    build:
      context: ./frontend
    depends_on:
      - api
    ports:
      - "127.0.0.1:8088:80"
volumes:
  sqlserver_data:

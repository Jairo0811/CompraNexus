name: CompraNexus CI
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
jobs:
  dotnet:
    name: API .NET 10 / xUnit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore backend/CompraNexus.slnx
      - name: Build
        run: dotnet build backend/CompraNexus.slnx -c Release --no-restore
      - name: xUnit tests
        run: dotnet test backend/CompraNexus.slnx -c Release --no-build --verbosity normal
  frontend:
    name: React / Vitest / Playwright
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Build TypeScript and Vite
        run: npm run build
      - name: Vitest tests
        run: npm run test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser smoke tests
        run: npm run test:e2e

  powershell:
    name: Windows PowerShell / local config smoke
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate password repair script
        shell: pwsh
        run: ./scripts/Test-StartupConfig.ps1

name: CompraNexus CI
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
jobs:
  dotnet:
    name: API .NET 10 / xUnit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore backend/CompraNexus.slnx
      - name: Build
        run: dotnet build backend/CompraNexus.slnx -c Release --no-restore
      - name: Start SQL Server (efímero, solo CI)
        run: |
          SA_PASSWORD="Ci-$(openssl rand -hex 12)-Aa1!"
          echo "::add-mask::$SA_PASSWORD"
          docker run -d --name ci-sql -p 14330:1433 -e ACCEPT_EULA=Y -e "MSSQL_SA_PASSWORD=$SA_PASSWORD" mcr.microsoft.com/mssql/server:2022-latest
          echo "COMPRANEXUS_TEST_SQL=Server=localhost,14330;User Id=sa;Password=$SA_PASSWORD;TrustServerCertificate=True;Encrypt=True" >> "$GITHUB_ENV"
          for i in $(seq 1 60); do
            if docker logs ci-sql 2>&1 | grep -q "SQL Server is now ready for client connections"; then exit 0; fi
            sleep 2
          done
          docker logs ci-sql
          exit 1
      - name: xUnit tests
        run: dotnet test backend/CompraNexus.slnx -c Release --no-build --verbosity normal
      - name: Auth HTTP smoke with isolated SQL Server
        shell: bash
        run: |
          set -euo pipefail
          export ASPNETCORE_ENVIRONMENT=Development
          export ASPNETCORE_URLS=http://127.0.0.1:5099
          export ConnectionStrings__SqlServer="${COMPRANEXUS_TEST_SQL};Database=CompraNexus_CI_Auth"
          export Auth__BootstrapEmail="ci-auth@example.test"
          export Auth__BootstrapPassword="Ci-$(openssl rand -hex 18)-Aa1!"
          export Auth__KeysPath="$RUNNER_TEMP/auth-keys"
          dotnet run --project backend/CompraNexus.Api/CompraNexus.Api.csproj -c Release --no-build --no-launch-profile > "$RUNNER_TEMP/auth-api.log" 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5099/health > /dev/null 2>&1; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:5099/health > /dev/null
          base="http://127.0.0.1:5099/api"
          jar="$RUNNER_TEMP/auth-cookies.txt"
          status=$(curl -sS -o /dev/null -w '%{http_code}' "$base/dashboard")
          test "$status" = "401"
          token=$(curl -fsS -c "$jar" -b "$jar" "$base/auth/csrf" | jq -r '.token')
          test -n "$token"
          payload=$(jq -nc --arg email "$Auth__BootstrapEmail" --arg password "$Auth__BootstrapPassword" '{email:$email,password:$password}')
          status=$(curl -sS -o /dev/null -w '%{http_code}' -c "$jar" -b "$jar" -H 'Content-Type: application/json' -d "$payload" "$base/auth/login")
          test "$status" = "400"
          status=$(curl -sS -o /dev/null -w '%{http_code}' -c "$jar" -b "$jar" -H 'Content-Type: application/json' -H "X-CSRF-TOKEN: $token" -d "$payload" "$base/auth/login")
          test "$status" = "200"
          status=$(curl -sS -o /dev/null -w '%{http_code}' -b "$jar" "$base/dashboard")
          test "$status" = "200"
          token=$(curl -fsS -c "$jar" -b "$jar" "$base/auth/csrf" | jq -r '.token')
          status=$(curl -sS -o /dev/null -w '%{http_code}' -c "$jar" -b "$jar" -X POST -H "X-CSRF-TOKEN: $token" "$base/auth/logout")
          test "$status" = "204"
          status=$(curl -sS -o /dev/null -w '%{http_code}' -b "$jar" "$base/dashboard")
          test "$status" = "401"
  frontend:
    name: React / Vitest / Playwright
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Build TypeScript and Vite
        run: npm run build
      - name: Vitest tests
        run: npm run test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser smoke tests
        run: npm run test:e2e

  powershell:
    name: Windows PowerShell / local config smoke
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate password repair script
        shell: pwsh
        run: ./scripts/Test-StartupConfig.ps1
